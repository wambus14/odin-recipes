    <title>Microwave Popcorn</title>
</head>
<body>
    <h1> Microwave Popcorn</h1>
    <img src="../images/popcorn.jpeg" alt="popcorn">
    <h2>Description</h2>
    <p>Popcorn is very yummy and microwave popcorn is easy to make</p>
    <h2>Ingredients</h2>
    <ul>
        <li>Bag of microwave popcorn</li>
    </ul>
    <h2> Steps</h2>
    <ol type="1"> 
        <li>Put bag of popcorn in microwave</li>
        <li>Set microwave to 2 minutes</li>
        <li>Wait until time between popping noises is over a second</li>
        <li>Enjoy!</li>
    </ol>
